# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Cap the Kotlin compile daemon too - otherwise it defaults to a much larger,
# unbounded heap and is usually the real RAM hog on Compose projects.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
# Single-module project - parallel execution just spawns extra JVMs for no benefit here.
org.gradle.parallel=false
org.gradle.workers.max=2
# AndroidX
android.useAndroidX=true
# Kotlin official code style
kotlin.code.style=official
# Namespaced R classes (smaller R)
android.nonTransitiveRClass=true
# R8 shrinks code and resources in one pass, dropping resources only reachable from removed code.
android.r8.optimizedResourceShrinking=true

